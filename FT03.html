DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clube de Informática</title>
  <style>
    body {
      background-color: #F0F5FA;
      font-family: Verdana, sans-serif;
      font-size: 14px;
      color: #243447;
      margin: 30px;
    }
    h1 {
      font-family: Arial, sans-serif;
      font-size: 28px;
      font-weight: bold;
      color: #15375A;
      text-align: center;
    }
    p { text-align: center; }
    table {
      width: 90%;
      margin: 25px auto;
      border: 3px solid red;
      border-collapse: collapse;
      background-color: white;
    }
    th, td {
      border: 1px solid red;
      padding: 14px 10px;
      text-align: center;
      vertical-align: middle;
    }
    th { background-color: #FECACA; font-weight: bold; }
    .projeto { background-color: #BFDBFE; }
    .robotica { background-color: #BBF7D0; }
    .inscricoes {
      background-color: #FDE68A;
      color: #78350F;
      font-size: 16px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <h1>Clube de Informática</h1>
  <p>Horário semanal de atividades — 2026/2027</p>
  <table>
    <tr>
      <th>Hora</th>
      <th>Segunda</th>
      <th>Terça</th>
      <th>Quarta</th>
      <th>Quinta</th>
    </tr>
    <tr>
      <td>14h–15h</td>
      <td>HTML</td>
      <td>CSS</td>
      <td>Python</td>
      <td>Redes</td>
    </tr>
    <tr>
      <td>15h–16h</td>
      <td colspan="2" class="projeto">Projeto Web</td>
      <td>Python</td>
      <td>Redes</td>
    </tr>
    <tr>
      <td>16h–17h</td>
      <td>HTML</td>
      <td>CSS</td>
      <td rowspan="2" class="robotica">Robótica</td>
      <td>Redes</td>
    </tr>
    <tr>
      <td>17h–18h</td>
      <td>JavaScript</td>
      <td>CSS</td>
      <td>Redes</td>
    </tr>
    <tr>
      <td colspan="5" class="inscricoes">Inscrições abertas — Participa!</td>
    </tr>
  </table>
</body>
</html>
