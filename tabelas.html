<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>exercicios tabelas</title>
    <style>
        h1 {
            font-family: Arial black;
            font-size: 40px;
            color: blue;
            text-align: center;
        }
th{background-color: darkcyan;}
        td,
        th {
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
            font-size: 25px;
            border: solid green 3px;
            width: 150px;


        }

        table {
            border: solid green 3px;
            border-collapse: collapse;
        }
    </style>
</head>

<body>
    <h1>inserção e formatação de tabelas</h1>
    <table align="center"">
        <caption align="bottom">tabela API 11D -T1</caption>
        
        <tr>
            <th colspan="5">despesas anuais</th>
        <tr>
            <th colspan="2"></th>
            <th>1º trimestre</th>
            <th>2º trimestre</th>
            <th>3º trimestre</th>
            <tr>
                <th rowspan="3">tipo de despesa</th>
                <td>agua</td>
                <td>100€</td>
                <td>80€</td>
                <td>150€</td>
            <tr>
                <td>energia</td>
                <td>200€</td>
                <td>150€</td>
                <td>300€</td>
                <tr>
                    <td>comucicações</td>
                  <td>40€</td>
                  <td>42€</td>
                  <td>45€</td>

                

                    

    </table>
</body>

</html>
